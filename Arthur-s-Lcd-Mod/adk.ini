[generators]
# All ADK generators remain enabled unless a feature overrides this value.
all = true

# Individual switches: api, chat, client-server-boundary, constants,
# gui, mdk-pack-test, modules, network, singleton, terminal-controls.
api = true
chat = true
client-server-boundary = true
constants = true
gui = true
mdk-pack-test = true
modules = true
network = true
singleton = true
terminal-controls = true
observable-properties = true
preview-clones = true


